<!DOCTYPE html>
<html lang="zh-CN" style="width: 100%; height: 100%">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Pixel Streaming 自定义播放器</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #222;
            color: #eee;
        }

        .slider-container {
            position: fixed;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            height: 600px;
            width: 50px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 5px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1000;
            box-sizing: border-box;
            gap: 40px;
        }

        .slider-container label {
            margin-bottom: 50px;
            font-size: 1.1em;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
            writing-mode: vertical-lr;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 200px;
            height: 10px;
            border-radius: 5px;
            background: #d3d3d3;
            outline: none;
            opacity: 0.7;
            transition: opacity .2s;
            cursor: pointer;
            transform: rotate(90deg);
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .slider:hover {
            opacity: 1;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            border: 2px solid #fff;
        }

        .slider::-moz-range-thumb {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            border: 2px solid #fff;
        }

        #playercontainer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body style="width: 100vw; height: 100svh; min-height: -webkit-fill-available; overflow: hidden; overscroll-behavior: none; font-family: 'Montserrat'; margin: 0px">
    <!-- Pixel Streaming Player 容器 -->
    <div id="playercontainer"></div>

    <!-- 滑条容器 -->
    <div class="slider-container">
        <label for="customSlider" style="writing-mode:vertical-lr;font-size:1.1em;color:#fff;text-shadow:1px 1px 2px rgba(0,0,0,0.7);margin-bottom:50.0px;">焦距 (0.0-100.0)</label>
        <input type="range" min="0" max="100" step="0.1" value="10" class="slider" id="customSlider">
        <div id="focusValue" style="color:#fff;margin-top:50px;writing-mode:vertical-lr;font-size:1.1em;">当前焦距：10.0</div>
    </div>
    <script>
        const slider = document.getElementById('customSlider');
        const focusValue = document.getElementById('focusValue');
        slider.addEventListener('input', function() {
            focusValue.textContent = '当前焦距：' + this.value;
        });
    </script>
</body>
</html>
